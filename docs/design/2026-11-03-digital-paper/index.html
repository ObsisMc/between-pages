&lt;div

&lt;script&gt;
  (function () {
    const root = document.getElementById(&#x27;bp-suite&#x27;);
    const saved = window.openai?.widgetState?.privateContent || {};
    const ownSnapshots = new Set();
    const dateData = [
      {
        day: &#x27;3&#x27;,
        week: &#x27;周二&#x27;,
        note: &#x27;一起把平常的日子记下来&#x27;,
        self: &#x27;今天下班的时候，天还没有完全黑。绕了一点路，在街角买了两枝花。&#x27;,
        self2: &#x27;回家找了个玻璃瓶插起来，放在窗边。想等你有空的时候，一起看看它们。&#x27;,
        other: &#x27;我这边刚刚开始下雨。看到你发来的花，忽然觉得今天也有一小件值得记下来的事。&#x27;,
      },
      {
        day: &#x27;2&#x27;,
        week: &#x27;周一&#x27;,
        note: &#x27;那家小店，下次一起去&#x27;,
        self: &#x27;午后去了常走的那条路，发现街角开了一家小小的面包店。&#x27;,
        self2: &#x27;买了刚出炉的可颂。下次等你来，我们一起坐在窗边慢慢吃。&#x27;,
        other: &#x27;把店名记下来了。今天也喝到了一杯很好喝的咖啡，想带你去试试。&#x27;,
      },
      {
        day: &#x27;1&#x27;,
        week: &#x27;周日&#x27;,
        note: &#x27;没有安排的一天&#x27;,
        self: &#x27;今天没有设闹钟，醒来已经快到中午。给自己做了一顿慢慢的早餐。&#x27;,
        self2: &#x27;下午收拾了书架，找出一本读到一半的书。这样的周末，也很好。&#x27;,
        other: &#x27;我把上次散步的照片整理好了。最喜欢的还是你回头笑的那张。&#x27;,
      },
    ];
    function icon(name) {
      return &#x27;&lt;i data-lucide=&quot;&#x27; + name + &#x27;&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&#x27;;
    }
    function persist() {
      if (window.openai?.setWidgetState) {
        const ui = {};
        root.querySelectorAll(&#x27;[data-app]&#x27;).forEach((a) =&gt; (ui[a.dataset.app] = a._state));
        ownSnapshots.add(JSON.stringify(ui));
        window.openai
          .setWidgetState({
            modelContent: {
              designs: [&#x27;轻书页&#x27;, &#x27;保留书框&#x27;],
              screen: &#x27;完整页面示意：主页、日记、心愿、纪念日、两地时间、空间、备份、登录与邀请&#x27;,
            },
            privateContent: ui,
          })
          .catch(() =&gt; {});
      }
    }
    function refreshIcons() {
      if (globalThis.lucide) lucide.createIcons({ attrs: { width: 16, height: 16 } });
    }
    function entries(app) {
      const d = dateData[app._state.date];
      return `&lt;article class=&quot;bp-entry mine&quot;&gt;&lt;div class=&quot;bp-author&quot;&gt;&lt;span class=&quot;bp-face&quot;&gt;··&lt;/span&gt;&lt;span&gt;小林 &lt;span style=&quot;color:var(--bp-soft)&quot;&gt;· 我&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;bp-quiet&quot;&gt;与小雨共享&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;bp-entrytext&quot; contenteditable=&quot;true&quot; role=&quot;textbox&quot; aria-label=&quot;我的日记示意&quot; aria-multiline=&quot;true&quot; spellcheck=&quot;false&quot;&gt;&lt;p&gt;${d.self}&lt;/p&gt;&lt;p&gt;${d.self2}&lt;/p&gt;&lt;/div&gt;&lt;/article&gt;&lt;hr class=&quot;bp-rule&quot;&gt;&lt;article class=&quot;bp-entry partner&quot;&gt;&lt;div class=&quot;bp-author&quot;&gt;&lt;span class=&quot;bp-face blue&quot;&gt;··&lt;/span&gt;&lt;span&gt;小雨&lt;/span&gt;&lt;span class=&quot;bp-quiet&quot;&gt;${app._state.date === 0 ? &#x27;刚刚写下&#x27; : &#x27;那天写下&#x27;}&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;bp-entrytext&quot;&gt;&lt;p&gt;${app._state.date === 0 ? &#x27;&lt;span class=&quot;bp-newmark&quot;&gt;&#x27; + d.other + &#x27;&lt;/span&gt;&#x27; : d.other}&lt;/p&gt;&lt;/div&gt;&lt;/article&gt;`;
    }
    function journal(app) {
      const s = app._state,
        d = dateData[s.date];
      return `&lt;div class=&quot;bp-workspace&quot;&gt;&lt;aside class=&quot;bp-index&quot; aria-label=&quot;日记日期&quot;&gt;&lt;div class=&quot;bp-indexhead&quot;&gt;&lt;strong&gt;我们的日记&lt;/strong&gt;&lt;button class=&quot;bp-iconbtn cursor-interaction&quot; data-action=&quot;calendar&quot; aria-label=&quot;选择日记日期&quot;&gt;${icon(&#x27;calendar-days&#x27;)}&lt;/button&gt;&lt;/div&gt;&lt;button class=&quot;bp-btn bp-write main cursor-interaction&quot; data-action=&quot;today&quot;&gt;${icon(&#x27;pen-line&#x27;)} 写今天&lt;/button&gt;&lt;div class=&quot;bp-month&quot;&gt;2026 年 11 月&lt;/div&gt;${dateData.map((x, i) =&gt; `&lt;button class=&quot;bp-date cursor-interaction&quot; data-date=&quot;${i}&quot; aria-pressed=&quot;${s.date === i}&quot;&gt;&lt;span class=&quot;bp-row&quot;&gt;&lt;span&gt;11 月 ${x.day} 日 · ${x.week}&lt;/span&gt;${i === 0 ? &#x27;&lt;span class=&quot;bp-dot&quot; aria-label=&quot;有新内容&quot;&gt;&lt;/span&gt;&#x27; : &#x27;&#x27;}&lt;/span&gt;&lt;small&gt;${x.note}&lt;/small&gt;&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;div class=&quot;bp-indexbottom&quot;&gt;${icon(&#x27;sun&#x27;)} TA 那边 07:24&lt;br&gt;新的一天，刚刚开始。&lt;/div&gt;&lt;/aside&gt;&lt;main class=&quot;bp-reading&quot;&gt;&lt;div class=&quot;bp-meta&quot;&gt;2026 年 11 月 · ${d.week}&lt;/div&gt;&lt;div class=&quot;bp-titleline&quot;&gt;&lt;h2&gt;11 月 ${d.day} 日&lt;/h2&gt;&lt;div class=&quot;bp-tools&quot;&gt;&lt;button class=&quot;bp-iconbtn cursor-interaction&quot; data-action=&quot;history&quot; aria-label=&quot;查看历史&quot;&gt;${icon(&#x27;history&#x27;)}&lt;/button&gt;&lt;button class=&quot;bp-iconbtn cursor-interaction&quot; data-action=&quot;options&quot; aria-label=&quot;阅读选项&quot; aria-expanded=&quot;false&quot;&gt;${icon(&#x27;sliders-horizontal&#x27;)}&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;bp-toolbar&quot;&gt;&lt;div class=&quot;bp-segment&quot; aria-label=&quot;日记视图&quot;&gt;${[&#x27;双人&#x27;, &#x27;我的&#x27;, &#x27;TA 的&#x27;].map((v, i) =&gt; `&lt;button class=&quot;cursor-interaction&quot; data-view=&quot;${i}&quot; aria-pressed=&quot;${s.view === i}&quot;&gt;${v}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;button class=&quot;bp-new cursor-interaction&quot; data-action=&quot;unread&quot;&gt;${s.date === 0 ? &#x27;小雨有一段新内容 ↓&#x27; : &#x27;这天的日记&#x27;}&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;bp-history&quot; hidden&gt;&lt;div&gt;历史版本&lt;/div&gt;&lt;div&gt;今天 18:20 · 已保存的版本&lt;/div&gt;&lt;div&gt;今天 17:46 · 已保存的版本&lt;/div&gt;&lt;button class=&quot;bp-quiet cursor-interaction&quot; data-action=&quot;history&quot;&gt;收起历史&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;bp-entries&quot;&gt;${entries(app)}&lt;/div&gt;&lt;footer class=&quot;bp-foot&quot;&gt;&lt;span class=&quot;bp-saved&quot;&gt;${icon(&#x27;check&#x27;)} 已同步 · 对方可以看到&lt;/span&gt;&lt;button class=&quot;bp-quiet cursor-interaction&quot; data-action=&quot;backup&quot;&gt;${icon(&#x27;cloud-check&#x27;)} 备份详情&lt;/button&gt;&lt;/footer&gt;&lt;div class=&quot;bp-popover bp-options&quot; hidden&gt;&lt;label&gt;&lt;input type=&quot;checkbox&quot; data-filter=&quot;own&quot;&gt;只看我写的文字&lt;/label&gt;&lt;button class=&quot;cursor-interaction&quot; data-action=&quot;swap&quot;&gt;${icon(&#x27;arrow-down-up&#x27;)} 交换显示顺序&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;bp-popover bp-backup&quot; hidden&gt;&lt;div&gt;已备份到 Google&lt;/div&gt;&lt;div style=&quot;color:var(--bp-soft);margin-top:6px&quot;&gt;今天 18:20 · 日记的可读副本&lt;/div&gt;&lt;button class=&quot;cursor-interaction&quot; data-action=&quot;backup&quot;&gt;收起详情&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;bp-popover bp-calendar&quot; hidden&gt;${dateData.map((x, i) =&gt; `&lt;button class=&quot;cursor-interaction&quot; data-date=&quot;${i}&quot;&gt;11 月 ${x.day} 日 · ${x.week}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;/main&gt;&lt;/div&gt;`;
    }
    const wishes = [
      {
        name: &#x27;一盏床头阅读灯&#x27;,
        desc: &#x27;暖一点的光，可以陪我读完睡前的几页。&#x27;,
        site: &#x27;生活小物 · 2 天前&#x27;,
        glyph: &#x27;lamp-desk&#x27;,
        hearts: &#x27;♥ ♥ ♥ ♥&#x27;,
      },
      {
        name: &#x27;和你一起去看海&#x27;,
        desc: &#x27;不用安排很多事，走一走，吹吹风就好。&#x27;,
        site: &#x27;想一起做的事 · 11 月 1 日&#x27;,
        glyph: &#x27;waves&#x27;,
        hearts: &#x27;♥ ♥ ♥ ♥ ♥&#x27;,
      },
      {
        name: &#x27;一本喜欢的诗集&#x27;,
        desc: &#x27;可以在扉页写一句话给我。&#x27;,
        site: &#x27;书与纸张 · 10 月 28 日&#x27;,
        glyph: &#x27;book-open&#x27;,
        hearts: &#x27;♥ ♥ ♥&#x27;,
      },
    ];
    function wishpage(app) {
      return `&lt;main class=&quot;bp-wishes&quot;&gt;&lt;div class=&quot;bp-wishheader&quot;&gt;&lt;h2&gt;心愿与礼物&lt;/h2&gt;&lt;button class=&quot;bp-btn main cursor-interaction&quot; data-action=&quot;newwish&quot;&gt;${icon(&#x27;plus&#x27;)} 许个愿&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;bp-subline&quot;&gt;把喜欢的小事，留给彼此。&lt;/div&gt;&lt;div class=&quot;bp-wishtabs&quot; aria-label=&quot;心愿分类&quot;&gt;${[&#x27;小雨的心愿&#x27;, &#x27;我的心愿&#x27;, &#x27;悄悄准备&#x27;, &#x27;礼物墙&#x27;].map((t, i) =&gt; `&lt;button class=&quot;cursor-interaction&quot; data-wishtab=&quot;${i}&quot; aria-pressed=&quot;${app._state.wishtab === i}&quot;&gt;${t}${i === 0 ? &#x27; ·&#x27; : &#x27;&#x27;}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;div class=&quot;bp-wishlist&quot;&gt;&lt;/div&gt;&lt;div class=&quot;bp-bottomnote&quot;&gt;${icon(&#x27;lock-keyhole&#x27;)} &lt;span&gt;“悄悄准备”的内容只有你能看到。&lt;/span&gt;&lt;/div&gt;&lt;/main&gt;`;
    }
    function wishlist(app) {
      const box = app.querySelector(&#x27;.bp-wishlist&#x27;),
        tab = app._state.wishtab;
      if (!box) return;
      if (tab === 0 || tab === 1) {
        box.innerHTML = wishes

      return `&lt;main class=&quot;suite-page&quot;&gt;&lt;div class=&quot;suite-heading&quot;&gt;&lt;h2&gt;我们的空间&lt;/h2&gt;&lt;/div&gt;&lt;p class=&quot;suite-desc&quot;&gt;彼此有自己的日记，也有愿意分享给对方的部分。&lt;/p&gt;&lt;div class=&quot;suite-people&quot;&gt;&lt;div class=&quot;suite-person&quot;&gt;&lt;span class=&quot;bp-face&quot;&gt;··&lt;/span&gt;小林&lt;/div&gt;${icon(&#x27;link&#x27;)}&lt;div class=&quot;suite-person&quot;&gt;&lt;span class=&quot;bp-face blue&quot;&gt;··&lt;/span&gt;小雨&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;suite-settings&quot;&gt;&lt;section&gt;&lt;div class=&quot;suite-setting&quot;&gt;&lt;h3 class=&quot;suite-sectiontitle&quot;&gt;我的共享范围&lt;/h3&gt;&lt;p class=&quot;suite-soft&quot;&gt;${app._state.rangePreview || &#x27;2025 年 11 月 1 日起，包括以后写的日记。&#x27;}&lt;/p&gt;&lt;p class=&quot;suite-soft&quot; style=&quot;margin-top:10px&quot;&gt;只有你确认开放的日期，小雨才能看到。&lt;/p&gt;&lt;button class=&quot;bp-btn cursor-interaction&quot; data-extra=&quot;edit-range&quot;&gt;${icon(&#x27;calendar-range&#x27;)} 调整共享日期&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;suite-setting&quot;&gt;&lt;h3 class=&quot;suite-sectiontitle&quot;&gt;绑定记录&lt;/h3&gt;&lt;div class=&quot;suite-period&quot;&gt;与小雨的这段时光&lt;span&gt;2025 年 11 月 1 日 — 至今&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;aside class=&quot;suite-quietblock&quot;&gt;&lt;h3 class=&quot;suite-sectiontitle&quot;&gt;分享时，也知道边界&lt;/h3&gt;&lt;p class=&quot;suite-soft&quot;&gt;每个人只能修改自己写的文字。&lt;/p&gt;&lt;p class=&quot;suite-soft&quot;&gt;停止共享后，对方保留最后获准的只读版本；之后的私人修改不会更新给对方。&lt;/p&gt;&lt;button class=&quot;bp-quiet cursor-interaction&quot; data-extra=&quot;unbind-info&quot; style=&quot;margin-top:15px&quot;&gt;查看解除绑定的说明 ${icon(&#x27;arrow-up-right&#x27;)}&lt;/button&gt;&lt;div class=&quot;suite-feedback&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;&lt;/aside&gt;&lt;/div&gt;&lt;/main&gt;`;
    }
    function backupPage() {
      return `&lt;main class=&quot;suite-page&quot;&gt;&lt;div class=&quot;suite-heading&quot;&gt;&lt;h2&gt;备份&lt;/h2&gt;&lt;span class=&quot;suite-status&quot;&gt;${icon(&#x27;shield-check&#x27;)} 正常&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;suite-desc&quot;&gt;好好保存写下的每一天。&lt;/p&gt;&lt;div class=&quot;suite-settings&quot;&gt;&lt;section&gt;&lt;div class=&quot;suite-settingline&quot;&gt;&lt;div&gt;&lt;strong&gt;服务端自动备份&lt;/strong&gt;&lt;div class=&quot;suite-soft&quot;&gt;由服务自动完成，无需你操作。&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;suite-status&quot;&gt;已开启&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;suite-setting&quot; style=&quot;border-top:0&quot;&gt;&lt;h3 class=&quot;suite-sectiontitle&quot;&gt;我的 Google 可读副本&lt;/h3&gt;&lt;p class=&quot;suite-soft&quot;&gt;已连接你的 Google 账号&lt;/p&gt;&lt;p class=&quot;suite-soft&quot; style=&quot;margin-top:9px&quot;&gt;按年、月整理，在自己的 Google Docs 里也能读到。&lt;/p&gt;&lt;div class=&quot;suite-status&quot; style=&quot;margin-top:18px&quot;&gt;${icon(&#x27;check&#x27;)} 可见日记的历史版本已备份&lt;/div&gt;&lt;div class=&quot;suite-soft&quot; style=&quot;margin-top:7px&quot;&gt;最近完成 · 今天 20:20&lt;/div&gt;&lt;div style=&quot;display:flex;gap:11px;flex-wrap:wrap;margin-top:5px&quot;&gt;&lt;button class=&quot;bp-btn cursor-interaction&quot; data-extra=&quot;backup-now&quot;&gt;${icon(&#x27;refresh-cw&#x27;)} 现在备份&lt;/button&gt;&lt;button class=&quot;bp-btn cursor-interaction&quot; data-extra=&quot;backup-log&quot;&gt;查看记录&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;suite-feedback&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;&lt;div class=&quot;suite-log&quot; hidden&gt;&lt;div&gt;今天 20:20 · 11 月 3 日 · 已写入 Google&lt;/div&gt;&lt;div&gt;昨天 22:14 · 11 月 2 日 · 已写入 Google&lt;/div&gt;&lt;div&gt;11 月 1 日 21:06 · 首次备份完成&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;aside class=&quot;suite-quietblock&quot;&gt;&lt;h3 class=&quot;suite-sectiontitle&quot;&gt;三个状态，分别确认&lt;/h3&gt;&lt;p class=&quot;suite-soft&quot;&gt;已保存：文字已经存到服务器。&lt;/p&gt;&lt;p class=&quot;suite-soft&quot;&gt;已成历史：这段写作已经形成历史版本。&lt;/p&gt;&lt;p class=&quot;suite-soft&quot;&gt;已备份：对应的历史版本已写入 Google。&lt;/p&gt;&lt;hr class=&quot;bp-rule&quot;&gt;&lt;p class=&quot;suite-soft&quot;&gt;Google 里的副本是单向更新。在那边修改的文字，不会回到这里。&lt;/p&gt;&lt;/aside&gt;&lt;/div&gt;&lt;/main&gt;`;
    }
    function authPage(invite) {
      return `&lt;main class=&quot;suite-auth&quot;&gt;&lt;section class=&quot;suite-authintro&quot;&gt;&lt;div class=&quot;suite-kicker&quot;&gt;BETWEEN PAGES&lt;/div&gt;&lt;h2&gt;给彼此，留一页。&lt;/h2&gt;&lt;p class=&quot;suite-poem&quot;&gt;把今天的小事，&lt;br&gt;慢慢写成我们的故事。&lt;/p&gt;${windows()}&lt;/section&gt;&lt;section class=&quot;suite-authform&quot;&gt;&lt;h2&gt;${invite ? &#x27;小雨邀请你一起写&#x27; : &#x27;欢迎回来&#x27;}&lt;/h2&gt;&lt;p class=&quot;suite-soft&quot;&gt;${invite ? &#x27;你将与小雨建立一个固定的双人空间。请先确认当前账号与自己的共享范围。&#x27; : &#x27;一本属于两个人的日记，从这里继续。&#x27;}&lt;/p&gt;${invite ? `&lt;div class=&quot;suite-authlabel&quot;&gt;&lt;span class=&quot;bp-face&quot;&gt;··&lt;/span&gt;当前账号 · 小林&lt;/div&gt;&lt;div class=&quot;suite-authlabel&quot;&gt;${icon(&#x27;lock-keyhole&#x27;)} 共享范围：暂不开放日记&lt;/div&gt;&lt;p class=&quot;suite-soft&quot; style=&quot;margin-top:14px&quot;&gt;接受邀请后，可以在空间里选择想共享的日期。绑定对象固定为彼此。&lt;/p&gt;&lt;button class=&quot;bp-btn main cursor-interaction&quot; data-extra=&quot;accept-invite&quot;&gt;接受邀请&lt;/button&gt;` : `&lt;button class=&quot;bp-btn main cursor-interaction&quot; data-extra=&quot;sign-in&quot;&gt;继续使用 Google&lt;/button&gt;&lt;p class=&quot;suite-soft&quot; style=&quot;margin-top:18px&quot;&gt;登录与 Google 日记备份分别授权。&lt;/p&gt;&lt;button class=&quot;bp-quiet cursor-interaction&quot; data-screen=&quot;invite&quot; style=&quot;margin-top:24px&quot;&gt;看看邀请页面 ${icon(&#x27;arrow-right&#x27;)}&lt;/button&gt;`}&lt;/section&gt;&lt;/main&gt;`;
    }
    function safe(str) {
      return String(str).replace(
        /[&amp;&lt;&gt;&quot;&#x27;]/g,
        (c) =&gt; ({ &#x27;&amp;&#x27;: &#x27;&amp;amp;&#x27;, &#x27;&lt;&#x27;: &#x27;&amp;lt;&#x27;, &#x27;&gt;&#x27;: &#x27;&amp;gt;&#x27;, &#x27;&quot;&#x27;: &#x27;&amp;quot;&#x27;, &quot;&#x27;&quot;: &#x27;&amp;#39;&#x27; })[c],
      );
    }
    function extraDialog(app, kind) {
      const anniv = kind === &#x27;new-anniversary&#x27;;
      const overlay = document.createElement(&#x27;div&#x27;);
      overlay.className = &#x27;bp-dialogback&#x27;;
      overlay.innerHTML = `&lt;section class=&quot;bp-dialog&quot; role=&quot;dialog&quot; aria-modal=&quot;true&quot; aria-label=&quot;${anniv ? &#x27;记下一天&#x27; : &#x27;调整共享日期&#x27;}&quot;&gt;&lt;h3&gt;${anniv ? &#x27;记下一天&#x27; : &#x27;调整共享日期&#x27;}&lt;/h3&gt;${anniv ? `&lt;label class=&quot;bp-field&quot;&gt;这一天叫什么&lt;input name=&quot;event&quot; placeholder=&quot;例如，第一次见面的日子&quot;&gt;&lt;/label&gt;&lt;label class=&quot;bp-field&quot;&gt;日期&lt;input type=&quot;date&quot; name=&quot;date&quot; value=&quot;2026-11-21&quot;&gt;&lt;/label&gt;&lt;label class=&quot;suite-authlabel&quot;&gt;&lt;input type=&quot;checkbox&quot; checked&gt; 每年纪念这一天&lt;/label&gt;` : `&lt;p class=&quot;suite-soft&quot;&gt;只调整你自己的日记；小雨的共享范围由 TA 自己决定。&lt;/p&gt;&lt;label class=&quot;bp-field&quot;&gt;从这一天起共享&lt;input type=&quot;date&quot; name=&quot;date&quot; value=&quot;2025-11-01&quot;&gt;&lt;/label&gt;&lt;label class=&quot;suite-authlabel&quot;&gt;&lt;input type=&quot;checkbox&quot; checked&gt; 包括以后写的日记&lt;/label&gt;&lt;p class=&quot;suite-soft&quot;&gt;下一步会列出将开放和将停止更新的日期，再确认保存。&lt;/p&gt;`}&lt;div class=&quot;bp-dialogactions&quot;&gt;&lt;button class=&quot;bp-btn cursor-interaction&quot; data-close-extra&gt;取消&lt;/button&gt;&lt;button class=&quot;bp-btn main cursor-interaction&quot; data-save-extra&gt;${anniv ? &#x27;记下来&#x27; : &#x27;预览范围变化&#x27;}&lt;/button&gt;&lt;/div&gt;&lt;/section&gt;`;
      app.append(overlay);
      const previous = document.activeElement;
      const close = () =&gt; {
        overlay.remove();
        previous?.focus();
      };
      overlay.querySelector(&#x27;[data-close-extra]&#x27;).onclick = close;
      overlay.addEventListener(&#x27;click&#x27;, (e) =&gt; {
        if (e.target === overlay) close();
      });
      overlay.addEventListener(&#x27;keydown&#x27;, (e) =&gt; {
        if (e.key === &#x27;Escape&#x27;) close();
        if (e.key === &#x27;Tab&#x27;) {
          const fields = [...overlay.querySelectorAll(&#x27;input,button&#x27;)];
          if (e.shiftKey &amp;&amp; document.activeElement === fields[0]) {
            e.preventDefault();
            fields.at(-1).focus();
          } else if (!e.shiftKey &amp;&amp; document.activeElement === fields.at(-1)) {
            e.preventDefault();
            fields[0].focus();
          }
        }
      });
      overlay.querySelector(&#x27;[data-save-extra]&#x27;).onclick = () =&gt; {
        const input = overlay.querySelector(&#x27;input[name=date]&#x27;).value;
        if (!input) return;
        if (anniv) {
          const name = overlay.querySelector(&#x27;input[name=event]&#x27;).value.trim();
          if (!name) return;
          (app._state.addedAnniversaries ??= []).push({
            name,
            month: parseInt(input.slice(5, 7)) + &#x27; 月&#x27;,
            day: input.slice(8),
            desc: &#x27;每年纪念 · &#x27; + input,
          });
          close();
          render(app);
          persist();
        } else {
          overlay.querySelector(&#x27;.bp-dialog&#x27;).innerHTML =
            `&lt;h3&gt;确认共享变化&lt;/h3&gt;&lt;p class=&quot;suite-soft&quot;&gt;将开放：${safe(input)} 起的日记，包含之后的日期。&lt;/p&gt;&lt;p class=&quot;suite-soft&quot; style=&quot;margin-top:13px&quot;&gt;如果有日期停止共享，小雨会保留当时的只读版本。&lt;/p&gt;&lt;div class=&quot;suite-feedback&quot;&gt;这是范围确认的界面示意。&lt;/div&gt;&lt;div class=&quot;bp-dialogactions&quot;&gt;&lt;button class=&quot;bp-btn cursor-interaction&quot; data-finish&gt;返回空间&lt;/button&gt;&lt;/div&gt;`;
          overlay.querySelector(&#x27;[data-finish]&#x27;).onclick = close;
          overlay.querySelector(&#x27;button&#x27;).focus();
        }
      };
      overlay.querySelector(&#x27;input&#x27;).focus();
    }
    function extraAction(app, action) {
      if (action.startsWith(&#x27;open-&#x27;)) {
        app._state.date = +action.slice(5);
        app._state.screen = &#x27;diary&#x27;;
        render(app);
        return;
      }
      if (action === &#x27;new-anniversary&#x27; || action === &#x27;edit-range&#x27;) {
        extraDialog(app, action);
        return;
      }
      if (action === &#x27;sleep&#x27;) {
        const times = [...app.querySelectorAll(&#x27;input[type=time]&#x27;)].map((x) =&gt; x.value);
        app.querySelector(&#x27;.suite-feedback&#x27;).textContent =
          &#x27;作息预览：&#x27; + times[0] + &#x27; 入睡，&#x27; + times[1] + &#x27; 醒来。&#x27;;
      }
      if (action === &#x27;reminder&#x27;)
        app.querySelector(&#x27;.suite-feedback&#x27;).textContent = &#x27;生日提醒 · 提前 7 天（示意）&#x27;;
      if (action === &#x27;unbind-info&#x27;)
        app.querySelector(&#x27;.suite-feedback&#x27;).textContent =
          &#x27;解除后，双方保留获准的只读记录；之后的私人修改不再共享。&#x27;;
      if (action === &#x27;backup-log&#x27;) {
        const box = app.querySelector(&#x27;.suite-log&#x27;);
        box.hidden = !box.hidden;
      }
      if (action === &#x27;backup-now&#x27;)
        app.querySelector(&#x27;.suite-feedback&#x27;).textContent = &#x27;当前没有等待备份的历史版本。&#x27;;
      if (action === &#x27;sign-in&#x27;) {
        app._state.screen = &#x27;home&#x27;;
        render(app);
      }
      if (action === &#x27;accept-invite&#x27;) {
        app._state.screen = &#x27;space&#x27;;
        render(app);
      }
    }
    function pageBody(app) {
      switch (app._state.screen) {
        case &#x27;home&#x27;:
          return homePage();
        case &#x27;clocks&#x27;:
          return clocksPage(app);
        case &#x27;anniversaries&#x27;:
          return anniversariesPage(app);
        case &#x27;anniversary&#x27;:
          return anniversaryPage();
        case &#x27;space&#x27;:
          return spacePage(app);
        case &#x27;backup&#x27;:
          return backupPage();
        case &#x27;login&#x27;:
          return authPage(false);
        case &#x27;invite&#x27;:
          return authPage(true);
        case &#x27;wishes&#x27;:
          return wishpage(app);
        default:
          return journal(app);
      }
    }

    function render(app) {
      const s = app._state;
      app.innerHTML = suiteNav(app) + pageBody(app);
      if (s.screen === &#x27;wishes&#x27;) wishlist(app);
      else view(app);
      refreshIcons();
    }
    root.querySelectorAll(&#x27;[data-app]&#x27;).forEach((app) =&gt; {
      app._state = {
        screen: &#x27;home&#x27;,
        date: 0,
        view: 0,
        wishtab: 0,
        own: false,
        ...saved[app.dataset.app],
      };
      render(app);
      app.addEventListener(&#x27;click&#x27;, (e) =&gt; {
        const b = e.target.closest(&#x27;button&#x27;);
        if (!b) return;
        if (b.dataset.extra) {
          extraAction(app, b.dataset.extra);
          persist();
          return;
        }
        if (b.dataset.screen) {
          app._state.screen = b.dataset.screen;
          render(app);
        } else if (b.dataset.date !== undefined) {
          app._state.date = +b.dataset.date;
          render(app);
        } else if (b.dataset.view !== undefined) {
          app._state.view = +b.dataset.view;
          view(app);
        } else if (b.dataset.wishtab !== undefined) {
          app._state.wishtab = +b.dataset.wishtab;
          render(app);
        } else if (b.dataset.prepare !== undefined) {
          if (app._state.wishtab === 0) {
            app._state.preparing = wishes[+b.dataset.prepare].name;
            app._state.wishtab = 2;
            render(app);
          } else dialog(app);
        } else {
          const action = b.dataset.action;
          if (action === &#x27;newwish&#x27;) dialog(app);
          if (action === &#x27;today&#x27;) {
            app._state.date = 0;
            render(app);
            app.querySelector(&#x27;[contenteditable]&#x27;)?.focus();
          }
          if (action === &#x27;options&#x27; || action === &#x27;backup&#x27; || action === &#x27;calendar&#x27;) {
            const panel = app.querySelector(&#x27;.bp-&#x27; + action);
            if (panel) {
              panel.hidden = !panel.hidden;
              b.setAttribute(&#x27;aria-expanded&#x27;, String(!panel.hidden));
            }
          }
          if (action === &#x27;history&#x27;) {
            const panel = app.querySelector(&#x27;.bp-history&#x27;);
            panel.hidden = !panel.hidden;
          }
          if (action === &#x27;unread&#x27;) {
            app._state.view = 0;
            app._state.own = false;
            view(app);
            app
              .querySelector(&#x27;.bp-entry.partner&#x27;)
              .scrollIntoView({ block: &#x27;nearest&#x27;, behavior: &#x27;smooth&#x27; });
          }
          if (action === &#x27;swap&#x27;) {
            const box = app.querySelector(&#x27;.bp-entries&#x27;),
              a = box.querySelector(&#x27;.mine&#x27;),
              p = box.querySelector(&#x27;.partner&#x27;),
              r = box.querySelector(&#x27;.bp-rule&#x27;);
            if (box.firstElementChild === a) {
              box.replaceChildren(p, r, a);
            } else box.replaceChildren(a, r, p);
            app.querySelector(&#x27;.bp-options&#x27;).hidden = true;
          }
        }
        persist();
      });
      app.addEventListener(&#x27;change&#x27;, (e) =&gt; {
        if (e.target.dataset.filter === &#x27;own&#x27;) {
          app._state.own = e.target.checked;
          view(app);
          persist();
        }
      });
      app.addEventListener(&#x27;input&#x27;, (e) =&gt; {
        if (e.target.closest(&#x27;[contenteditable]&#x27;)) {
          const status = app.querySelector(&#x27;.bp-saved&#x27;);
          status.textContent = &#x27;编辑示意 · 未连接服务器&#x27;;
        }
      });
    });
    window.addEventListener(&#x27;openai:set_globals&#x27;, (e) =&gt; {
      const ui = e.detail?.globals?.widgetState?.privateContent;
      if (ui &amp;&amp; !ownSnapshots.has(JSON.stringify(ui)))
        root.querySelectorAll(&#x27;[data-app]&#x27;).forEach((a) =&gt; {
          if (ui[a.dataset.app] &amp;&amp; JSON.stringify(a._state) !== JSON.stringify(ui[a.dataset.app])) {
            Object.assign(a._state, ui[a.dataset.app]);
            render(a);
          }
        });
    });
    if (globalThis.Tweak) {
      const design = { bodySize: 16 };
      const reader = root.querySelector(&#x27;[data-app=&quot;desktop&quot;]&#x27;);
      const tweak = new Tweak({
        container: reader,
        onChange: () =&gt;
          root
            .querySelectorAll(&#x27;.bp-entrytext&#x27;)
            .forEach((x) =&gt; (x.style.fontSize = design.bodySize + &#x27;px&#x27;)),
      });
      tweak.addSlider(design, &#x27;bodySize&#x27;, {
        label: &#x27;正文大小&#x27;,
        min: 14,
        max: 20,
        step: 1,
        unit: &#x27;px&#x27;,
      });
    }
  })();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {

    window.FloatingUIDOM;

  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;

      if (target?.nodeType === Node.ELEMENT_NODE) {

      }

  };
  const containsTarget = (trigger, target) =&gt;

  const getContent = (trigger) =&gt;

  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;

    }
