# Every job runs the same command a developer runs locally (AGENTS.md#commands).
name: ci

on:
  pull_request:
    # labeled/unlabeled re-run docs-gates when `docs-not-needed` is toggled.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

# Every job has a time limit well above its normal run, so a hung step (one browser install
# once took 24 minutes) fails instead of holding the run for GitHub's six-hour default.

env:
  # Range of commits this run is about: the PR's commits, or what a push added to main.
  CHECK_RANGE: ${{ github.event_name == 'pull_request' && format('origin/{0}...HEAD', github.base_ref) || format('{0}..{1}', github.event.before, github.sha) }}

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run format:check

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Database tests (*.db.test.ts) need a real PostgreSQL; the password is test data.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: between_pages_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d between_pages_test"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://postgres:test-only@127.0.0.1:5432/between_pages_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run test:coverage
      - run: npm run test:prototypes

  commit-convention:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run check -- commits "$CHECK_RANGE"

  docs-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - name: whitespace and conflict markers
        run: git diff --check "$CHECK_RANGE"
      - run: npm run check -- docs
      # Label bypasses are decided on the PR; re-running these on the merge push would
      # fail every PR that was merged with a bypass label.
      - run: npm run check -- pairs "$CHECK_RANGE"
        if: github.event_name == 'pull_request'
        env:
          DOCS_NOT_NEEDED: ${{ contains(github.event.pull_request.labels.*.name, 'docs-not-needed') }}
          ROADMAP_NOT_NEEDED: ${{ contains(github.event.pull_request.labels.*.name, 'roadmap-not-needed') }}
          ADR_AMEND: ${{ contains(github.event.pull_request.labels.*.name, 'adr-amend') }}

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Login (authentication-and-sessions E1-E6) and the diary screen (kernel phase 3) in
    # Chromium, Firefox and WebKit; not a
    # required check (the ADR leaves branch protection unchanged).
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: between_pages_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d between_pages_test"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://postgres:test-only@127.0.0.1:5432/between_pages_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e:all

  e2e-pwa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # installable-pwa: the service worker exists only in a production build, so these tests
    # run apart from e2e against `vite preview` of two builds, in Chromium only.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: between_pages_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d between_pages_test"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://postgres:test-only@127.0.0.1:5432/between_pages_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:pwa
